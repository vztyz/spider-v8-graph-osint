<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spider V8 - Intelligence Graph</title>
    <script src="https://unpkg.com/force-graph"></script>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="loading" class="glass">🚀 Загрузка и расчет физики...</div>
    
    <!-- Верхняя панель фильтров и инструментов -->
    <div id="topbar" class="glass">
        <a href="dashboard.html" class="glass-btn secondary" style="text-decoration: none; padding: 8px 12px; margin-right: 5px;">⬅ Menu</a>
        <a href="wizard.html" class="glass-btn ai-btn" style="text-decoration: none; padding: 8px 12px; margin-right: 5px;">🪄 Wizard</a>
        <div class="divider"></div>
        
        <input type="text" id="search-box" class="search-input" placeholder="Поиск (название, @юзер, тег)...">
        <div class="divider"></div>
        
        <label class="chk-wrapper">
            <input type="checkbox" id="hide-empty-chk"> Hide empty (Subs=0)
        </label>
        <div class="divider"></div>
        
        <div class="filter-group">
            <span style="font-weight: bold; width: 60px; color:#fff;" id="subs-val">Subs: 0</span>
            <input type="range" id="subs-slider" min="0" max="100" step="1" value="0">
        </div>
        <div class="divider"></div>

        <button id="btn-mode" class="glass-btn primary">🌌 Макро (Ниши)</button>
        <button id="btn-dim" class="glass-btn secondary">🧊 3D Режим</button>
        <button id="btn-ai-helper" class="glass-btn ai-btn">🤖 AI HELPER</button>
    </div>

    <!-- Левая панель визуальных настроек -->
    <div id="visual-controls" class="glass">
        <p class="vc-title">Visual Settings</p>
        <div>
            <div class="vc-row"><span>Node Spread:</span><span id="spread-val" style="color:#fff; font-weight:bold;">1.0x</span></div>
            <input type="range" id="spread-slider" min="50" max="300" step="10" value="100" style="width:100%; margin-top:5px;">
        </div>
        <div>
            <div class="vc-row"><span>Lines Opacity:</span><span id="alpha-val" style="color:#fff; font-weight:bold;">45</span></div>
            <input type="range" id="alpha-slider" min="0" max="255" step="5" value="45" style="width:100%; margin-top:5px;">
        </div>
    </div>

    <!-- Правая панель информации об УЗЛЕ -->
    <div id="sidebar" class="glass">
        <div class="close-btn" onclick="closeSidebar()">✕ Закрыть</div>
        <h2 id="sb-title">Channel Name</h2>
        <p id="sb-username">@username</p>
        <p id="sb-stats">Subs: 0</p>
        <p id="sb-tags">Tags: None</p>
        <div style="font-size: 12px; font-weight: bold; margin-top: 5px;">Recent Content:</div>
        <div class="scroll-content" id="sb-posts">No recent content</div>
        <a href="#" target="_blank" id="sb-link" class="btn-tg">Open in Telegram</a>
    </div>

    <!-- ПАНЕЛЬ AI HELPER -->
    <div id="ai-sidebar" class="glass">
        <div class="ai-header">
            <h3>🤖 OSINT AI Helper</h3>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button id="btn-ai-settings" class="glass-btn outline" style="padding:4px 8px; font-size:11px;">⚙️ Промпт</button>
                <div class="close-btn" id="close-ai-btn" style="margin:0;">✕</div>
            </div>
        </div>
        
        <div id="ai-settings-panel" style="display: none;">
            <p style="margin: 0 0 10px 0; font-size: 13px; font-weight: bold; color: #a78bfa;">Системный Промпт ИИ:</p>
            <textarea id="ai-system-prompt"></textarea>
            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end;">
                <button id="btn-close-prompt" class="glass-btn secondary" style="padding: 6px 12px;">Отмена</button>
                <button id="btn-save-prompt" class="glass-btn ai-btn" style="padding: 6px 12px;">Сохранить</button>
            </div>
        </div>

        <div class="ai-chat-area" id="ai-chat-area"></div>

        <div class="ai-filters-row">
            <div style="display: flex; gap: 10px; align-items: center;">
                <label>Min Subs:</label>
                <input type="number" id="ai-min-subs" placeholder="0">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <label>Max Subs:</label>
                <input type="number" id="ai-max-subs" placeholder="∞">
            </div>
        </div>

        <div class="ai-input-container">
            <textarea id="ai-input" placeholder="Опиши свою задачу... (Shift+Enter для переноса, Enter для отправки)"></textarea>
            <button id="btn-ai-send">➤</button>
        </div>
    </div>

    <div id="graph-container"></div>
    <script src="app.js?v=10"></script>
</body>
</html>
